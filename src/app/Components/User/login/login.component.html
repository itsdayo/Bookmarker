<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <i class="fas fa-bookmark"></i>
      </div>
      <h1>Welcome Back</h1>
      <p>Sign in to your Bookmarker account</p>
    </div>

    <form (ngSubmit)="login()" #f="ngForm" class="auth-form">
      <div class="form-group">
        <label for="username" class="form-label">
          <i class="fas fa-user"></i> Username
        </label>
        <input
          type="text"
          ngModel
          #username="ngModel"
          name="username"
          id="username"
          placeholder="Enter your username"
          class="form-control"
          required
          [disabled]="isLoading"
          [ngClass]="{ 'is-invalid': !username.valid && username.touched }"
        />
        <div
          class="invalid-feedback"
          *ngIf="!username.valid && username.touched"
        >
          Please enter username!
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">
          <i class="fas fa-lock"></i> Password
        </label>
        <div class="password-input-group">
          <input
            type="password"
            name="password"
            id="password"
            placeholder="Enter your password"
            ngModel
            #password="ngModel"
            class="form-control"
            required
            [disabled]="isLoading"
            [ngClass]="{ 'is-invalid': !password.valid && password.touched }"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [disabled]="isLoading"
          >
            <i
              class="fas"
              [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"
            ></i>
          </button>
        </div>
        <div
          class="invalid-feedback"
          *ngIf="!password.valid && password.touched"
        >
          Please enter password!
        </div>
      </div>

      <div class="alert alert-danger" *ngIf="errorFlag">
        <i class="fas fa-exclamation-triangle"></i> {{ errorMsg }}
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-block btn-lg"
        [disabled]="f.invalid || isLoading"
      >
        <span *ngIf="!isLoading">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </span>
        <span *ngIf="isLoading" class="loading-spinner">
          <span
            class="spinner-border spinner-border-sm"
            role="status"
            aria-hidden="true"
          ></span>
          Signing in...
        </span>
      </button>

      <div class="auth-footer">
        <p>Don't have an account?</p>
        <button
          type="button"
          class="btn btn-outline-primary"
          routerLink="/register"
          [disabled]="isLoading"
        >
          <i class="fas fa-user-plus"></i> Create Account
        </button>
      </div>
    </form>
  </div>
</div>
