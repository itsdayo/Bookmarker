<div class="profile-container">
  <div class="profile-header">
    <div class="header-content">
      <div class="profile-avatar">
        <i class="fas fa-user-circle"></i>
      </div>
      <div class="profile-info">
        <h1>{{ user.username }}</h1>
        <p>Manage your account settings</p>
      </div>
      <div class="header-actions">
        <button
          type="submit"
          form="profileForm"
          class="btn btn-primary"
          [disabled]="isLoading"
        >
          <span *ngIf="!isLoading">
            <i class="fas fa-save"></i> Save Changes
          </span>
          <span *ngIf="isLoading" class="loading-spinner">
            <span
              class="spinner-border spinner-border-sm"
              role="status"
              aria-hidden="true"
            ></span>
            Saving...
          </span>
        </button>
      </div>
    </div>
  </div>

  <div class="profile-content">
    <div class="profile-card">
      <div class="card-header">
        <h2><i class="fas fa-user-edit"></i> Edit Profile</h2>
      </div>

      <div class="card-body">
        <div class="alert alert-success" *ngIf="submitSuccess">
          <i class="fas fa-check-circle"></i> Profile updated successfully!
        </div>

        <div
          class="alert alert-danger"
          *ngIf="username.touched && username.invalid"
        >
          <i class="fas fa-exclamation-triangle"></i> Please Enter a Username
        </div>

        <div class="alert alert-danger" *ngIf="usernameTaken">
          <i class="fas fa-exclamation-triangle"></i> Username is already taken
        </div>

        <form
          (ngSubmit)="update()"
          id="profileForm"
          #f="ngForm"
          class="profile-form"
        >
          <div class="form-row">
            <div class="form-group">
              <label for="username" class="form-label">
                <i class="fas fa-user"></i> Username
              </label>
              <input
                type="text"
                ngModel="{{ user.username }}"
                #username="ngModel"
                name="username"
                id="username"
                placeholder="username"
                class="form-control"
                required
                [disabled]="isLoading"
                [ngClass]="{
                  'is-invalid': username.touched && username.invalid
                }"
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="email" class="form-label">
                <i class="fas fa-envelope"></i> Email Address
              </label>
              <input
                type="email"
                name="email"
                id="email"
                ngModel="{{ user.email }}"
                #email="ngModel"
                placeholder="email@example.com"
                class="form-control"
                [disabled]="isLoading"
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group half-width">
              <label for="firstName" class="form-label">
                <i class="fas fa-user"></i> First Name
              </label>
              <input
                type="text"
                name="firstName"
                id="firstName"
                ngModel="{{ user.firstName }}"
                #firstName="ngModel"
                placeholder="First name"
                class="form-control"
                [disabled]="isLoading"
              />
            </div>

            <div class="form-group half-width">
              <label for="lastName" class="form-label">
                <i class="fas fa-user"></i> Last Name
              </label>
              <input
                type="text"
                name="lastName"
                id="lastName"
                ngModel="{{ user.lastName }}"
                #lastName="ngModel"
                placeholder="Last name"
                class="form-control"
                [disabled]="isLoading"
              />
            </div>
          </div>
        </form>
      </div>
    </div>

    <div class="action-cards">
      <div class="action-card">
        <div class="card-content">
          <h3><i class="fas fa-globe"></i> Manage Websites</h3>
          <p>View and manage your bookmarked websites</p>
        </div>
        <button
          class="btn btn-outline-primary"
          routerLink="/user/{{ uid }}/website"
          [disabled]="isLoading"
        >
          <i class="fas fa-arrow-right"></i> Go to Websites
        </button>
      </div>

      <div class="action-card danger">
        <div class="card-content">
          <h3><i class="fas fa-sign-out-alt"></i> Sign Out</h3>
          <p>Sign out of your account</p>
        </div>
        <button
          (click)="logout()"
          class="btn btn-outline-danger"
          [disabled]="isLoading"
        >
          <i class="fas fa-sign-out-alt"></i> Log Out
        </button>
      </div>
    </div>
  </div>
</div>
