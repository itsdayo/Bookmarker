<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <i class="fas fa-bookmark"></i>
      </div>
      <h1>Create Account</h1>
      <p>Join Bookmarker to organize your bookmarks</p>
    </div>

    <form (ngSubmit)="register()" #f="ngForm" class="auth-form">
      <div class="form-group">
        <label for="username" class="form-label">
          <i class="fas fa-user"></i> Username
        </label>
        <input
          type="text"
          ngModel
          #username="ngModel"
          name="username"
          id="username"
          placeholder="Choose a username"
          class="form-control"
          required
          [disabled]="isLoading"
          [ngClass]="{ 'is-invalid': username.invalid && username.touched }"
        />
        <div
          class="invalid-feedback"
          *ngIf="username.invalid && username.touched"
        >
          Please Enter a Username!
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">
          <i class="fas fa-lock"></i> Password
        </label>
        <div class="password-input-group">
          <input
            type="password"
            ngModel
            #password="ngModel"
            name="password"
            id="password"
            placeholder="Create a password"
            class="form-control"
            required
            [disabled]="isLoading"
            [ngClass]="{ 'is-invalid': password.invalid && password.touched }"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility('password')"
            [disabled]="isLoading"
          >
            <i
              class="fas"
              [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"
            ></i>
          </button>
        </div>
        <div
          class="invalid-feedback"
          *ngIf="password.invalid && password.touched"
        >
          Please Enter a Password!
        </div>
      </div>

      <div class="form-group">
        <label for="verifyPassword" class="form-label">
          <i class="fas fa-lock"></i> Confirm Password
        </label>
        <div class="password-input-group">
          <input
            type="password"
            ngModel
            #verifyPassword="ngModel"
            name="verifyPassword"
            id="verifyPassword"
            placeholder="Confirm your password"
            class="form-control"
            required
            [disabled]="isLoading"
            [ngClass]="{
              'is-invalid': verifyPassword.invalid && verifyPassword.touched
            }"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility('verifyPassword')"
            [disabled]="isLoading"
          >
            <i
              class="fas"
              [ngClass]="showVerifyPassword ? 'fa-eye-slash' : 'fa-eye'"
            ></i>
          </button>
        </div>
        <div
          class="invalid-feedback"
          *ngIf="verifyPassword.invalid && verifyPassword.touched"
        >
          Please Verify your Password
        </div>
      </div>

      <div class="alert alert-danger" *ngIf="usernameError">
        <i class="fas fa-exclamation-triangle"></i> Username already taken
      </div>

      <div class="alert alert-danger" *ngIf="passwordError">
        <i class="fas fa-exclamation-triangle"></i> Passwords do not match
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-block btn-lg"
        [disabled]="f.invalid || isLoading"
      >
        <span *ngIf="!isLoading">
          <i class="fas fa-user-plus"></i> Create Account
        </span>
        <span *ngIf="isLoading" class="loading-spinner">
          <span
            class="spinner-border spinner-border-sm"
            role="status"
            aria-hidden="true"
          ></span>
          Registering...
        </span>
      </button>

      <div class="auth-footer">
        <p>Already have an account?</p>
        <button
          type="button"
          class="btn btn-outline-primary"
          routerLink="/login"
          [disabled]="isLoading"
        >
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
      </div>
    </form>
  </div>
</div>
