<div class="website-container">
  <!-- Header -->
  <div class="website-header">
    <div class="header-content">
      <div class="header-left">
        <a class="back-btn" routerLink="/user">
          <i class="fas fa-chevron-left"></i>
        </a>
        <h1 class="page-title">Websites</h1>
      </div>
      <div class="header-right">
        <a class="add-btn" routerLink="/user/{{ uid }}/website/new">
          <i class="fas fa-plus"></i>
          <span>New</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="website-content">
    <div class="content-wrapper">
      <!-- Websites Grid -->
      <div class="websites-section">
        <div class="section-header">
          <h2><i class="fas fa-globe"></i> Your Websites</h2>
          <p class="section-description">Manage and organize your websites</p>
        </div>

        <div class="websites-grid" *ngIf="websites.length > 0; else noWebsites">
          <div class="website-card" *ngFor="let website of websites">
            <div class="card-header">
              <div class="website-icon">
                <i class="fas fa-file-alt"></i>
              </div>
              <div class="website-actions">
                <a
                  class="edit-btn"
                  routerLink="/user/{{ uid }}/website/{{ website.id }}"
                >
                  <i class="fas fa-cog"></i>
                </a>
              </div>
            </div>

            <div class="card-body">
              <h3 class="website-name">{{ website.name }}</h3>
              <p class="website-description" *ngIf="website.description">
                {{ website.description }}
              </p>
              <p class="website-description" *ngIf="!website.description">
                No description available
              </p>
            </div>

            <div class="card-footer">
              <a
                class="view-pages-btn"
                routerLink="/user/{{ uid }}/website/{{ website.id }}/page"
              >
                <i class="fas fa-eye"></i>
                <span>View Pages</span>
              </a>
            </div>
          </div>
        </div>

        <!-- No Websites Template -->
        <ng-template #noWebsites>
          <div class="no-websites">
            <div class="no-websites-icon">
              <i class="fas fa-globe"></i>
            </div>
            <h3>No Websites Yet</h3>
            <p>Start by creating your first website</p>
            <a
              class="create-first-btn"
              routerLink="/user/{{ uid }}/website/new"
            >
              <i class="fas fa-plus"></i>
              Create Your First Website
            </a>
          </div>
        </ng-template>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <a class="nav-link" routerLink="/user">
      <i class="fas fa-user"></i>
      <span>Profile</span>
    </a>
  </div>
</div>
