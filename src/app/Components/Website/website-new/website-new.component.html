<div class="website-container">
  <!-- Header -->
  <div class="website-header">
    <div class="header-content">
      <div class="header-left">
        <a class="back-btn" routerLink="/user/{{ uid }}/website">
          <i class="fas fa-chevron-left"></i>
        </a>
        <h1 class="page-title">New Website</h1>
      </div>
      <div class="header-right">
        <a class="add-btn" routerLink="/user/{{ uid }}/website/new">
          <i class="fas fa-plus"></i>
        </a>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="website-content">
    <div class="content-wrapper">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="sidebar-header">
          <h3><i class="fas fa-globe"></i> Websites</h3>
        </div>
        <div class="website-list">
          <div class="website-item" *ngFor="let website of websites">
            <a
              class="website-link"
              routerLink="/user/{{ uid }}/website/{{ website.id }}/page"
            >
              <i class="fas fa-file-alt"></i>
              <span>{{ website.name }}</span>
            </a>
            <a
              class="settings-btn"
              routerLink="/user/{{ uid }}/website/{{ website.id }}"
            >
              <i class="fas fa-cog"></i>
            </a>
          </div>
        </div>
      </div>

      <!-- Form Section -->
      <div class="form-section">
        <div class="form-card">
          <div class="card-header">
            <h2><i class="fas fa-plus-circle"></i> Create New Website</h2>
            <button
              class="save-btn"
              type="submit"
              form="websiteForm"
              [disabled]="f.invalid || isLoading"
            >
              <i class="fas fa-check"></i>
              <span *ngIf="!isLoading">Save</span>
              <span *ngIf="isLoading">Saving...</span>
            </button>
          </div>

          <div class="card-body">
            <form id="websiteForm" (ngSubmit)="create()" #f="ngForm">
              <!-- Alert -->
              <div
                class="alert alert-danger"
                *ngIf="name.invalid && name.touched"
              >
                <i class="fas fa-exclamation-triangle"></i>
                Please enter a Website Name!
              </div>

              <!-- Website Name -->
              <div class="form-group">
                <label for="name" class="form-label">
                  <i class="fas fa-tag"></i> Website Name
                </label>
                <input
                  class="form-control"
                  type="text"
                  name="name"
                  id="name"
                  placeholder="Enter your website name"
                  required
                  ngModel
                  #name="ngModel"
                  [disabled]="isLoading"
                  [ngClass]="{ 'is-invalid': name.invalid && name.touched }"
                />
                <div
                  class="invalid-feedback"
                  *ngIf="name.invalid && name.touched"
                >
                  Website name is required
                </div>
              </div>

              <!-- Website Description -->
              <div class="form-group">
                <label for="description" class="form-label">
                  <i class="fas fa-align-left"></i> Website Description
                </label>
                <textarea
                  class="form-control"
                  id="description"
                  name="description"
                  rows="4"
                  placeholder="Describe your website..."
                  ngModel
                  #description="ngModel"
                  [disabled]="isLoading"
                ></textarea>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <a class="nav-link" routerLink="/user">
      <i class="fas fa-user"></i>
      <span>Profile</span>
    </a>
  </div>
</div>
