<div class="widget-container">
  <!-- Main Content -->
  <div class="widget-content">
    <div class="content-wrapper">
      <!-- Form Section -->
      <div class="form-section">
        <div class="form-card">
          <div class="card-header">
            <h2><i class="fas fa-code"></i> HTML Widget Settings</h2>
          </div>

          <div class="card-body">
            <form id="widgetForm" (ngSubmit)="update()" #f="ngForm">
              <!-- Widget Name -->
              <div class="form-group">
                <label for="name" class="form-label">
                  <i class="fas fa-tag"></i> Widget Name
                </label>
                <input
                  class="form-control"
                  type="text"
                  name="name"
                  id="name"
                  placeholder="Enter a widget name..."
                  [ngModel]="widget.name"
                  #name="ngModel"
                  [disabled]="isLoading"
                />
              </div>

              <!-- HTML Content -->
              <div class="form-group">
                <label for="text" class="form-label">
                  <i class="fas fa-code"></i> HTML Content
                </label>
                <div class="editor-container">
                  <quill-editor
                    name="text"
                    id="text"
                    [(ngModel)]="widget.text"
                    #text="ngModel"
                    [disabled]="isLoading"
                    placeholder="Enter HTML content..."
                  ></quill-editor>
                </div>
              </div>

              <!-- Action Buttons -->
              <div class="form-actions">
                <button
                  type="submit"
                  class="save-btn"
                  [disabled]="f.invalid || isLoading"
                >
                  <i class="fas fa-save"></i>
                  <span *ngIf="!isLoading">Save Changes</span>
                  <span *ngIf="isLoading">Saving...</span>
                </button>
                <button
                  type="button"
                  class="delete-btn"
                  (click)="delete()"
                  [disabled]="isLoading"
                  *ngIf="widget.text"
                >
                  <i class="fas fa-trash"></i>
                  Delete Widget
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
