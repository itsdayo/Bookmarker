<div class="widget-container">
  <!-- Main Content -->
  <div class="widget-content">
    <div class="content-wrapper">
      <!-- Form Section -->
      <div class="form-section">
        <div class="form-card">
          <div class="card-header">
            <h2><i class="fas fa-image"></i> Image Widget Settings</h2>
          </div>

          <div class="card-body">
            <form id="widgetForm" (ngSubmit)="update($event)" #f="ngForm">
              <!-- Widget Name -->
              <div class="form-group">
                <label for="name" class="form-label">
                  <i class="fas fa-tag"></i> Widget Name
                </label>
                <input
                  class="form-control"
                  type="text"
                  name="name"
                  id="name"
                  placeholder="Enter a widget name..."
                  [ngModel]="widget.name"
                  #name="ngModel"
                  [disabled]="isLoading"
                />
              </div>

              <!-- Widget Text/Alt Text -->
              <div class="form-group">
                <label for="text" class="form-label">
                  <i class="fas fa-info-circle"></i> Alt Text
                </label>
                <input
                  class="form-control"
                  type="text"
                  name="text"
                  id="text"
                  placeholder="Enter image alt text..."
                  [ngModel]="widget.text"
                  #text="ngModel"
                  [disabled]="isLoading"
                />
              </div>

              <!-- Image Width -->
              <div class="form-group">
                <label for="width" class="form-label">
                  <i class="fas fa-arrows-alt-h"></i> Image Width
                </label>
                <input
                  class="form-control"
                  type="text"
                  name="width"
                  id="width"
                  placeholder="100%"
                  [ngModel]="widget.width"
                  #width="ngModel"
                  [disabled]="isLoading"
                />
              </div>

              <!-- Image Source Selection -->
              <div [ngSwitch]="imageType">
                <!-- URL Input -->
                <div *ngSwitchCase="'url'" class="form-group">
                  <label for="url" class="form-label">
                    <i class="fas fa-link"></i> Image URL
                  </label>
                  <div
                    class="alert alert-danger"
                    *ngIf="url.invalid && (url.dirty || url.touched)"
                  >
                    <i class="fas fa-exclamation-triangle"></i>
                    <span *ngIf="url.errors?.['required']"
                      >Image URL is required</span
                    >
                    <span *ngIf="url.errors?.['pattern']"
                      >Please enter a valid URL (must start with http:// or
                      https://)</span
                    >
                  </div>
                  <input
                    class="form-control"
                    type="text"
                    name="url"
                    id="url"
                    placeholder="https://www.image.com"
                    [(ngModel)]="widget.url"
                    #url="ngModel"
                    required
                    pattern="https?://.+"
                    [disabled]="isLoading"
                    [ngClass]="{
                      'is-invalid': url.invalid && (url.dirty || url.touched)
                    }"
                  />
                </div>

                <!-- File Upload -->
                <div *ngSwitchCase="'file'" class="form-group">
                  <label class="form-label">
                    <i class="fas fa-upload"></i> Upload Image
                  </label>
                  <div class="upload-section">
                    <p class="upload-text">
                      File upload functionality coming soon
                    </p>
                    <button
                      type="button"
                      class="btn btn-secondary"
                      (click)="changeImageStatus()"
                      [disabled]="isLoading"
                    >
                      <i class="fas fa-link"></i>
                      Enter URL Instead
                    </button>
                  </div>
                </div>
                <span *ngSwitchDefault>Not working</span>
              </div>

              <!-- Flickr Search Button -->
              <div class="form-group">
                <button
                  type="button"
                  class="flickr-btn"
                  routerLink="/user/{{ uid }}/website/{{ wid }}/page/{{
                    pid
                  }}/widget/{{ wgid }}/flickr"
                  [disabled]="isLoading"
                >
                  <i class="fab fa-flickr"></i>
                  Photos from Flickr
                </button>
              </div>

              <!-- Action Buttons -->
              <div class="form-actions">
                <button
                  type="submit"
                  class="save-btn"
                  [disabled]="!widget.url || f.invalid || isLoading"
                >
                  <i class="fas fa-save"></i>
                  <span *ngIf="!isLoading">Save Changes</span>
                  <span *ngIf="isLoading">Saving...</span>
                </button>
                <button
                  type="button"
                  class="delete-btn"
                  (click)="delete()"
                  [disabled]="isLoading"
                  *ngIf="widget.url"
                >
                  <i class="fas fa-trash"></i>
                  Delete Widget
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
