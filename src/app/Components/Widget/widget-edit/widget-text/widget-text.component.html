<div class="widget-container">
  <!-- Main Content -->
  <div class="widget-content">
    <div class="content-wrapper">
      <!-- Form Section -->
      <div class="form-section">
        <div class="form-card">
          <div class="card-header">
            <h2><i class="fas fa-font"></i> Text Widget Settings</h2>
          </div>

          <div class="card-body">
            <form id="widgetForm" (ngSubmit)="update()" #f="ngForm">
              <!-- Widget Text Content -->
              <div class="form-group">
                <label for="text" class="form-label">
                  <i class="fas fa-font"></i> Text Content
                </label>
                <textarea
                  class="form-control"
                  name="text"
                  id="text"
                  placeholder="Enter widget text content..."
                  [ngModel]="widget.text"
                  #name="ngModel"
                  [disabled]="isLoading"
                  rows="4"
                ></textarea>
              </div>

              <!-- Text Size -->
              <div class="form-group">
                <label for="size" class="form-label">
                  <i class="fas fa-text-height"></i> Text Size
                </label>
                <select
                  class="form-control"
                  name="size"
                  id="size"
                  [ngModel]="widget.size"
                  #size="ngModel"
                  [disabled]="isLoading"
                >
                  <option value="1">Extra Small</option>
                  <option value="2">Small</option>
                  <option value="3">Medium</option>
                  <option value="4">Large</option>
                  <option value="5">Extra Large</option>
                </select>
              </div>

              <!-- Placeholder Text -->
              <div class="form-group">
                <label for="placeholder" class="form-label">
                  <i class="fas fa-info-circle"></i> Placeholder Text
                </label>
                <input
                  class="form-control"
                  type="text"
                  id="placeholder"
                  name="placeholder"
                  placeholder="Enter a placeholder..."
                  [(ngModel)]="widget.placeholder"
                  required
                  [disabled]="isLoading"
                />
              </div>

              <!-- Action Buttons -->
              <div class="form-actions">
                <button
                  type="submit"
                  class="save-btn"
                  [disabled]="f.invalid || isLoading"
                >
                  <i class="fas fa-save"></i>
                  <span *ngIf="!isLoading">Save Changes</span>
                  <span *ngIf="isLoading">Saving...</span>
                </button>
                <button
                  type="button"
                  class="delete-btn"
                  (click)="delete()"
                  [disabled]="isLoading"
                  *ngIf="widget.text"
                >
                  <i class="fas fa-trash"></i>
                  Delete Widget
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
